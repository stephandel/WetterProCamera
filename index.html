<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#03428A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WP Camera">
<meta name="description" content="Wetter-App im Apple-Stil, gestaltet mit dem Design-Konfigurator.">
<title>WetterProCamera</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="meteogramm.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="lib/leaflet/leaflet.css">
</head>
<body>

<header class="titelzeile glas" id="titelzeile">
  <button class="ikonknopf tippbar" id="btnMenue" aria-label="Meine Orte"></button>
  <div class="ort-block">
    <h1 class="ort" id="ortName">Mannheim</h1>
    <div class="modell" id="ortZeile">Modell: Beste Mischung</div>
  </div>
  <button class="ikonknopf tippbar" id="btnTeilen" aria-label="Wetter mit Foto teilen"></button>
  <button class="ikonknopf tippbar" id="btnSuche" aria-label="Ort suchen"></button>
</header>

<div class="hinweis" id="hinweis" role="status" aria-live="polite" hidden></div>

<main class="inhalt">
  <section id="tab-wetter" class="tab-seite" aria-labelledby="tb-wetter"></section>
  <section id="tab-graphs" class="tab-seite" aria-labelledby="tb-graphs" hidden></section>
  <section id="tab-radsat" class="tab-seite" aria-labelledby="tb-radsat" hidden></section>
  <section id="tab-mehr" class="tab-seite" aria-labelledby="tb-mehr" hidden></section>
</main>

<nav class="tabbar pille glas" role="tablist" aria-label="Bereiche" id="tabbar"></nav>

<!-- Teilen-Bildschirm: immer schwarz, Knöpfe wie in der Kamera-App -->
<dialog class="teilen" id="teilen" aria-label="Wetter mit Foto teilen">
  <div class="teilen-kopf"><button class="teilen-text tippbar" id="tAbbrechen">Abbrechen</button><button class="teilen-text tippbar" id="tGalerie" aria-haspopup="dialog" aria-label="Meine Wetterfotos öffnen">Galerie</button><button class="teilen-text tippbar" id="tInfosAuf" aria-haspopup="true" aria-controls="tBlatt">Infos</button></div>
  <div class="teilen-bild"><canvas id="tBild" role="img" aria-label="Vorschau des Bildes zum Teilen" tabindex="-1" autofocus></canvas><p class="teilen-beispiel" id="tBeispiel">Beispielfoto · tippe auf „Fotos" oder „Kamera"</p></div>
  <div class="teilen-formate" id="tFormate" role="radiogroup" aria-label="Format des Bildes"></div>
  <div class="teilen-stile" id="tStile" role="radiogroup" aria-label="Gestaltung des Bildes"></div>
  <div class="teilen-knoepfe">
    <label class="teilen-rund klein tippbar"><input type="file" accept="image/*" id="tFotos" hidden><span id="tFotosIkon"></span><span>Fotos</span></label>
    <button class="teilen-rund gross tippbar" id="tTeilen" aria-label="Bild teilen"></button>
    <label class="teilen-rund klein tippbar"><input type="file" accept="image/*" capture="environment" id="tKamera" hidden><span id="tKameraIkon"></span><span>Kamera</span></label>
  </div>
  <!-- Blatt „Infos": was aufs Foto kommt, Reihenfolge, Ort, Text, Farbton, Größe -->
  <div class="teilen-blatt" id="tBlatt" role="region" aria-labelledby="tBlattTitel" hidden>
    <div class="blatt-kopf"><h2 id="tBlattTitel">Infos aufs Foto</h2><button class="teilen-text tippbar" id="tInfosZu">Fertig</button></div>
    <div class="blatt-inhalt" id="tBlattInhalt"></div>
  </div>
</dialog>

<script src="symbole.js"></script>
<script src="ikonen.js"></script>
<script src="lib/leaflet/leaflet.min.js" defer></script>
<script src="meteogramm.js"></script>
<script src="app.js"></script>
</body>
</html>
